<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="_ds/organic-7163dcb2-b0a6-464c-a755-8d2ec69e234b/styles.css">
<script src="_ds/organic-7163dcb2-b0a6-464c-a755-8d2ec69e234b/_ds_bundle.js"></script>
<style>
  body { margin: 0; }
  .iz-row:hover { background: var(--color-neutral-100); }
  .iz-menu-item:hover { background: var(--color-accent-100); }
</style>
</helmet>
<div style="width:100%; height:100%; max-width:340px; min-width:260px; min-height:420px; display:flex; flex-direction:column; background:var(--color-bg); border:1px solid var(--color-neutral-300); border-radius:var(--radius-lg); font-family:var(--font-body); color:var(--color-text); overflow:hidden; box-sizing:border-box; box-shadow:var(--shadow-sm);">

  <div style="display:flex; flex-direction:column; gap:2px; padding:var(--space-4) var(--space-4) var(--space-3);">
    <span style="font-family:var(--font-heading); font-size:18px;">Inbox</span>
    <span style="font-size:12px; color:var(--color-neutral-700);">{{ totalUnread }} unread &middot; {{ totalShown }} to sort</span>
  </div>

  <div style="display:flex; flex-wrap:wrap; gap:6px; padding:0 var(--space-3) var(--space-3);">
    <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="6">
      <button onClick="{{ cat.select }}" style="display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; border:1.5px solid {{ cat.border }}; background:{{ cat.bg }}; color:{{ cat.fg }}; font-family:var(--font-body); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;">
        <span style="width:6px; height:6px; border-radius:50%; background:{{ cat.dot }}; flex-shrink:0;"></span>
        {{ cat.label }}
        <sc-if value="{{ cat.count }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:10.5px; opacity:0.75;">{{ cat.count }}</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{ isDeals }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; gap:var(--space-2); padding:0 var(--space-3) var(--space-3); flex-wrap:wrap;">
      <button onClick="{{ setDealFilterAll }}" class="tag {{ dealFilterAllClass }}" style="border:none; cursor:pointer; font-size:12px;">All</button>
      <button onClick="{{ setDealFilterExpiring }}" class="tag {{ dealFilterExpiringClass }}" style="border:none; cursor:pointer; font-size:12px;">Expiring soon</button>
      <button onClick="{{ setDealFilterGeneral }}" class="tag {{ dealFilterGeneralClass }}" style="border:none; cursor:pointer; font-size:12px;">General promo</button>
    </div>
  </sc-if>

  <div style="flex:1; overflow-y:auto; padding:0 var(--space-2) var(--space-3);">
    <sc-for list="{{ visibleEmails }}" as="em" hint-placeholder-count="6">
      <div class="iz-row" style="display:flex; align-items:flex-start; gap:var(--space-2); padding:var(--space-2); margin:1px var(--space-1); border-radius:var(--radius-md); position:relative; opacity:{{ em.rowOpacity }};">
        <div style="width:24px; height:24px; border-radius:50%; background:{{ em.avatarBg }}; color:{{ em.avatarFg }}; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex-shrink:0; margin-top:1px;">{{ em.initials }}</div>

        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:6px;">
            <div style="display:flex; align-items:center; gap:5px; min-width:0;">
              <sc-if value="{{ em.unread }}" hint-placeholder-val="{{ false }}">
                <span style="width:5px; height:5px; border-radius:50%; background:var(--color-accent-500); flex-shrink:0;"></span>
              </sc-if>
              <span style="font-size:12px; font-weight:{{ em.nameWeight }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ em.sender }}</span>
              <sc-if value="{{ em.folder }}" hint-placeholder-val="{{ false }}">
                <span class="tag tag-neutral" style="font-size:9.5px; padding:1px 6px;">{{ em.folder }}</span>
              </sc-if>
            </div>
            <span style="font-size:10.5px; color:var(--color-neutral-700); flex-shrink:0;">{{ em.time }}</span>
          </div>
          <div style="font-size:12px; font-weight:{{ em.nameWeight }}; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ em.subject }}</div>

          <sc-if value="{{ em.dealCode }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;">
              <span style="font-family:ui-monospace,Menlo,monospace; font-size:10px; padding:2px 6px; border-radius:var(--radius-sm); background:var(--color-accent-100); color:var(--color-accent-700); border:1px solid var(--color-accent-300);">{{ em.dealCode }}</span>
              <span style="font-size:10px; color:var(--color-accent-700); font-weight:600;">{{ em.expiryLabel }}</span>
            </div>
          </sc-if>
        </div>

        <div style="display:flex; align-items:center; gap:0px; flex-shrink:0; margin-top:0px;">
          <button onClick="{{ em.archive }}" title="Archive" class="btn btn-icon btn-ghost" style="width:24px; height:24px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="4" rx="1.5"></rect><path d="M5 8h14v11a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 015 19V8z"></path><path d="M10 12.5h4"></path></svg>
          </button>
          <a href="{{ em.gmailUrl }}" target="_blank" rel="noopener" onClick="{{ em.markOpened }}" title="Open in Gmail" class="btn btn-icon btn-ghost" style="width:24px; height:24px; text-decoration:none;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg>
          </a>
          <button onClick="{{ em.toggleMenu }}" title="More actions" class="btn btn-icon btn-ghost" style="width:24px; height:24px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle></svg>
          </button>
        </div>

        <sc-if value="{{ em.menuOpen }}" hint-placeholder-val="{{ false }}">
          <div class="card elev-md" style="position:absolute; top:32px; right:var(--space-2); z-index:10; padding:6px; min-width:180px; display:flex; flex-direction:column; gap:2px;">
            <button onClick="{{ em.toggleRead }}" class="iz-menu-item" style="text-align:left; border:none; background:transparent; padding:7px 9px; border-radius:var(--radius-sm); font-size:11.5px; cursor:pointer; color:var(--color-text);">{{ em.readMenuLabel }}</button>
            <div style="height:1px; background:var(--color-neutral-300); margin:3px 6px;"></div>
            <button onClick="{{ em.moveActionRequired }}" class="iz-menu-item" style="text-align:left; border:none; background:transparent; padding:7px 9px; border-radius:var(--radius-sm); font-size:11.5px; cursor:pointer; color:var(--color-text);">Move to Action Required</button>
            <button onClick="{{ em.moveWork }}" class="iz-menu-item" style="text-align:left; border:none; background:transparent; padding:7px 9px; border-radius:var(--radius-sm); font-size:11.5px; cursor:pointer; color:var(--color-text);">Move to Work</button>
            <button onClick="{{ em.moveTravel }}" class="iz-menu-item" style="text-align:left; border:none; background:transparent; padding:7px 9px; border-radius:var(--radius-sm); font-size:11.5px; cursor:pointer; color:var(--color-text);">Move to Travel</button>
            <button onClick="{{ em.moveFollowUp }}" class="iz-menu-item" style="text-align:left; border:none; background:transparent; padding:7px 9px; border-radius:var(--radius-sm); font-size:11.5px; cursor:pointer; color:var(--color-text);">Move to Follow-up</button>
            <div style="height:1px; background:var(--color-neutral-300); margin:3px 6px;"></div>
            <button onClick="{{ em.delete }}" class="iz-menu-item" style="text-align:left; border:none; background:transparent; padding:7px 9px; border-radius:var(--radius-sm); font-size:11.5px; cursor:pointer; color:var(--color-text);">Delete</button>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 16px; color:var(--color-neutral-700); text-align:center;">
        <div style="width:30px; height:30px; border-radius:50%; border:2px solid var(--color-accent-2-500); display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-2-500)" stroke-width="2.75"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
        <div style="font-family:var(--font-heading); font-size:13px; color:var(--color-text);">Cleared</div>
        <div style="font-size:11px; margin-top:2px;">Nothing left in this view.</div>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 300, &quot;height&quot;: 640}}">
function relTime(h) {
  if (h < 1) return "now";
  if (h < 24) return Math.round(h) + "h";
  return Math.round(h / 24) + "d";
}

const RAW_EMAILS = [
  { id: 1, cat: "personal", sender: "M. Alvarez", subject: "Lorem ipsum dolor sit amet", snippet: "Consectetur adipiscing elit, sed do eiusmod tempor incididunt", hours: 2, unread: true },
  { id: 2, cat: "personal", sender: "R. Chen", subject: "Ut enim ad minim veniam", snippet: "Quis nostrud exercitation ullamco laboris nisi ut aliquip", hours: 5, unread: true },
  { id: 3, cat: "personal", sender: "S. Okafor", subject: "Duis aute irure dolor in", snippet: "Reprehenderit in voluptate velit esse cillum dolore eu fugiat", hours: 20, unread: false },
  { id: 4, cat: "personal", sender: "T. Novak", subject: "Excepteur sint occaecat cupidatat", snippet: "Non proident sunt in culpa qui officia deserunt mollit", hours: 30, unread: false },
  { id: 5, cat: "personal", sender: "J. Park", subject: "Sed ut perspiciatis unde omnis", snippet: "Iste natus error sit voluptatem accusantium doloremque laudantium", hours: 48, unread: true },

  { id: 6, cat: "recruiter", sender: "Recruiter \u2014 Company A", subject: "Staff role opportunity", snippet: "Totam rem aperiam eaque ipsa quae ab illo inventore", hours: 3, unread: true },
  { id: 7, cat: "recruiter", sender: "Recruiter \u2014 Company B", subject: "Quick chat about an opening?", snippet: "Veritatis et quasi architecto beatae vitae dicta sunt explicabo", hours: 26, unread: true },
  { id: 8, cat: "recruiter", sender: "Recruiter \u2014 Company C", subject: "Following up on my note", snippet: "Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit", hours: 70, unread: false },
  { id: 9, cat: "recruiter", sender: "Recruiter \u2014 Company D", subject: "Design opportunity on our team", snippet: "Aut fugit consequuntur magni dolores eos qui ratione voluptatem", hours: 96, unread: false },

  { id: 10, cat: "recurse", sender: "Recurse Center", subject: "This week's community events", snippet: "Neque porro quisquam est qui dolorem ipsum quia dolor sit", hours: 4, unread: true },
  { id: 11, cat: "recurse", sender: "RC Batch Group", subject: "Cohort check-in tomorrow", snippet: "Ut labore et dolore magnam aliquam quaerat voluptatem ut enim", hours: 14, unread: true },
  { id: 12, cat: "recurse", sender: "Recurse Center", subject: "Alumni project spotlight", snippet: "Ad minima veniam quis nostrum exercitationem ullam corporis suscipit", hours: 60, unread: false },
  { id: 13, cat: "recurse", sender: "RC Pairing Partner", subject: "Pairing session confirmed", snippet: "Laboriosam nisi ut aliquid ex ea commodi consequatur quis", hours: 12, unread: false },

  { id: 14, cat: "deals", sender: "Retailer A", subject: "50% off \u2014 ends tonight", snippet: "Autem vel eum iure reprehenderit qui in ea voluptate", hours: 1, unread: true, code: "SAVE50", expiresHours: 6 },
  { id: 15, cat: "deals", sender: "Retailer B", subject: "Flash sale: extra 15% cashback", snippet: "Esse quam nihil molestiae consequatur vel illum qui dolorem", hours: 3, unread: true, code: "FLASH15", expiresHours: 10 },
  { id: 16, cat: "deals", sender: "Service C", subject: "New features this month", snippet: "Eum fugiat quo voluptas nulla pariatur at vero eos", hours: 30, unread: false },
  { id: 17, cat: "deals", sender: "Retailer D", subject: "Member sale starts this weekend", snippet: "Accusamus et iusto odio dignissimos ducimus qui blanditiis", hours: 40, unread: false, code: "EARLY10", expiresHours: 72 },
  { id: 18, cat: "deals", sender: "Service E", subject: "You left something in your cart", snippet: "Praesentium voluptatum deleniti atque corrupti quos dolores et quas", hours: 50, unread: false },
  { id: 19, cat: "deals", sender: "Retailer F", subject: "24 hours left: $50 off", snippet: "Molestias excepturi sint occaecati cupiditate non provident similique", hours: 4, unread: true, code: "TIME50", expiresHours: 20 },
];

const CATS = [
  { id: "all", label: "All", dot: "var(--color-neutral-600)" },
  { id: "personal", label: "Personal", dot: "var(--color-accent-2-500)" },
  { id: "recruiter", label: "Recruiters", dot: "var(--color-accent-500)" },
  { id: "recurse", label: "Recurse Center", dot: "var(--color-neutral-700)" },
  { id: "deals", label: "Deals & Promos", dot: "var(--color-accent-700)" },
];

const CAT_PRIORITY = { personal: 0, recruiter: 1, recurse: 2, deals: 3 };

class Component extends DCLogic {
  state = {
    emails: RAW_EMAILS.map(e => ({ ...e, archived: false, folder: null, opened: false })),
    activeTab: "all",
    dealFilter: "all",
    openMenuFor: null,
  };

  setTab(id) { this.setState({ activeTab: id, dealFilter: "all", openMenuFor: null }); }
  archive(id) { this.setState(s => ({ emails: s.emails.map(e => e.id === id ? { ...e, archived: true } : e), openMenuFor: null })); }
  delete(id) { this.setState(s => ({ emails: s.emails.filter(e => e.id !== id), openMenuFor: null })); }
  toggleRead(id) { this.setState(s => ({ emails: s.emails.map(e => e.id === id ? { ...e, unread: !e.unread } : e), openMenuFor: null })); }
  moveTo(id, folder) { this.setState(s => ({ emails: s.emails.map(e => e.id === id ? { ...e, folder } : e), openMenuFor: null })); }
  markOpened(id) { this.setState(s => ({ emails: s.emails.map(e => e.id === id ? { ...e, opened: true } : e) })); }
  toggleMenu(id) { this.setState(s => ({ openMenuFor: s.openMenuFor === id ? null : id })); }

  renderVals() {
    const { emails, activeTab, dealFilter, openMenuFor } = this.state;
    const active = emails.filter(e => !e.archived && e.unread && !e.folder);

    const countFor = (catId) => {
      if (catId === "all") return active.length;
      return active.filter(e => e.cat === catId).length;
    };

    const categories = CATS.map(c => {
      const isActive = activeTab === c.id;
      return {
        ...c,
        count: countFor(c.id),
        select: () => this.setTab(c.id),
        bg: isActive ? "var(--color-accent-100)" : "var(--color-bg)",
        fg: isActive ? "var(--color-accent-700)" : "var(--color-text)",
        border: isActive ? "var(--color-accent-500)" : "var(--color-neutral-300)",
      };
    });

    let list;
    if (activeTab === "all") list = active;
    else list = active.filter(e => e.cat === activeTab);

    if (activeTab === "deals") {
      if (dealFilter === "expiring") list = list.filter(e => e.code);
      if (dealFilter === "general") list = list.filter(e => !e.code);
    }

    list = [...list].sort((a, b) => {
      if (activeTab === "all") {
        const pa = CAT_PRIORITY[a.cat] ?? 9, pb = CAT_PRIORITY[b.cat] ?? 9;
        if (pa !== pb) return pa - pb;
      }
      return a.hours - b.hours;
    });

    const visibleEmails = list.map(e => {
      const initials = e.sender.split(/[\s\u2014]/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase().slice(0, 2);
      const catMeta = CATS.find(c => c.id === e.cat);
      let expiryLabel = "";
      if (e.code) expiryLabel = "Expires in " + relTime(e.expiresHours);
      return {
        id: e.id,
        sender: e.sender,
        subject: e.subject,
        snippet: e.snippet,
        time: relTime(e.hours),
        unread: e.unread,
        opened: e.opened,
        nameWeight: e.unread ? 650 : 400,
        rowOpacity: e.opened ? 0.55 : 1,
        initials,
        avatarBg: catMeta ? "color-mix(in oklch, " + catMeta.dot + " 20%, var(--color-bg))" : "var(--color-neutral-200)",
        avatarFg: catMeta ? catMeta.dot : "var(--color-text)",
        dealCode: e.code || null,
        expiryLabel,
        folder: e.folder,
        menuOpen: openMenuFor === e.id,
        readMenuLabel: e.unread ? "Mark as read" : "Mark as unread",
        toggleMenu: () => this.toggleMenu(e.id),
        markOpened: () => this.markOpened(e.id),
        toggleRead: () => this.toggleRead(e.id),
        archive: () => this.archive(e.id),
        delete: () => this.delete(e.id),
        moveActionRequired: () => this.moveTo(e.id, "Action Required"),
        moveWork: () => this.moveTo(e.id, "Work"),
        moveTravel: () => this.moveTo(e.id, "Travel"),
        moveFollowUp: () => this.moveTo(e.id, "Follow-up"),
        gmailUrl: "https://mail.google.com/mail/u/0/#search/" + encodeURIComponent(e.subject),
      };
    });

    const isDeals = activeTab === "deals";
    const mk = (val) => dealFilter === val ? "tag-accent" : "tag-neutral";

    return {
      categories,
      visibleEmails,
      isEmpty: visibleEmails.length === 0,
      isDeals,
      totalUnread: active.filter(e => e.unread).length,
      totalShown: active.length,
      setDealFilterAll: () => this.setState({ dealFilter: "all" }),
      setDealFilterExpiring: () => this.setState({ dealFilter: "expiring" }),
      setDealFilterGeneral: () => this.setState({ dealFilter: "general" }),
      dealFilterAllClass: mk("all"),
      dealFilterExpiringClass: mk("expiring"),
      dealFilterGeneralClass: mk("general"),
    };
  }
}

</script>
</body>
</html>
