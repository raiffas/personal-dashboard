<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="day">
    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <button class="nav-logo" id="modeToggle" title="Toggle day/night mode">
            <span id="modeIcon">☀️</span>
        </button>
        <ul class="nav-links">
            <li><button class="nav-link active" data-page="home">Home (day)</button></li>
            <li><button class="nav-link" data-page="home-night">Home (night)</button></li>
            <li><button class="nav-link" data-page="inbox">Inbox</button></li>
            <li><button class="nav-link" data-page="calendar">Calendar</button></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Home Page -->
        <div class="home-page active">
            <div class="orb-container">
                <div class="orb"></div>
                <div class="headline-container">
                    <h1 class="hero-headline">good morning!</h1>
                    <span class="handwritten-accent">write your checkin!</span>
                </div>
            </div>

            <div class="side-arrows">
                <button class="arrow-button left" data-page="inbox">
                    <span class="arrow-label">inbox</span>
                </button>
                <button class="arrow-button right" data-page="calendar">
                    <span class="arrow-label">calendar</span>
                </button>
            </div>

            <div class="date-stamp" id="dateStamp">monday august 10 2026</div>
        </div>

        <!-- Inbox Page -->
        <div class="inbox-page">
            <h2 class="page-title">inbox</h2>
            <div class="empty-state">
                <p class="empty-state-text">nothing here yet</p>
            </div>
        </div>

        <!-- Calendar Page -->
        <div class="calendar-page">
            <h2 class="page-title">calendar</h2>
            <div class="empty-state">
                <p class="empty-state-text">jot your events here</p>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
